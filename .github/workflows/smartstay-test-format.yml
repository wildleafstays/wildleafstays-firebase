name: SmartStay Integration Test Formatter
on:
  pull_request:
    paths:
      - ".github/workflows/smartstay-test-format.yml"
permissions:
  contents: write
jobs:
  format:
    if: github.event.pull_request.head.repo.full_name == 'wildleafstays/wildleafstays-firebase' && github.event.pull_request.head.ref == 'feat/smartstay-unified-discovery-20261018'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: platform-api
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: platform-api/package-lock.json
      - run: npm ci
      - run: npx prettier --write test/public-catalog.integration.test.ts
      - run: npm run format:check
      - name: Commit format correction
        run: |
          git config user.name "wildleaf-format-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add test/public-catalog.integration.test.ts
          if ! git diff --cached --quiet; then
            git commit -m "style(smartstay): format search integration tests"
            git push origin HEAD:feat/smartstay-unified-discovery-20261018
          fi
