name: Platform API CI

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "platform-api/**"
      - "firebase.json"
      - ".github/workflows/platform-api-ci.yml"
  push:
    branches:
      - booking-engine-v2-foundation
      - "phase-*"
    paths:
      - "platform-api/**"
      - "firebase.json"
      - ".github/workflows/platform-api-ci.yml"

permissions:
  contents: read

concurrency:
  group: platform-api-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: wildleaf_test
          POSTGRES_USER: wildleaf
          POSTGRES_PASSWORD: wildleaf
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wildleaf -d wildleaf_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      DATABASE_URL: postgres://wildleaf:wildleaf@localhost:5432/wildleaf_test
      FIREBASE_PROJECT_ID: wildleaf-test
      DB_MAX_CONNECTIONS: 5

    defaults:
      run:
        working-directory: platform-api

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: platform-api/package-lock.json

      - name: Validate Firebase hosting routing contract
        working-directory: .
        run: |
          node <<'NODE'
          const fs = require("node:fs");

          const config = JSON.parse(
            fs.readFileSync("firebase.json", "utf8"),
          );

          const rewrites = config?.hosting?.rewrites;

          if (!Array.isArray(rewrites)) {
            throw new Error("firebase.json hosting.rewrites must be an array");
          }

          if (rewrites.length !== 3) {
            throw new Error(
              `Expected exactly 3 hosting rewrites; found ${rewrites.length}`,
            );
          }

          const [api, v1, spa] = rewrites;

          if (
            api?.source !== "/api/**" ||
            api?.function !== "api" ||
            Object.keys(api).sort().join(",") !== "function,source"
          ) {
            throw new Error(
              "Rewrite #1 must be exactly /api/** -> Firebase Function api",
            );
          }

          if (
            v1?.source !== "/v1/**" ||
            v1?.run?.serviceId !== "wildleaf-platform-api" ||
            v1?.run?.region !== "asia-south1" ||
            Object.keys(v1).sort().join(",") !== "run,source" ||
            Object.keys(v1.run).sort().join(",") !== "region,serviceId"
          ) {
            throw new Error(
              "Rewrite #2 must be exactly /v1/** -> Cloud Run wildleaf-platform-api in asia-south1",
            );
          }

          if (
            spa?.source !== "**" ||
            spa?.destination !== "/customer/index.html" ||
            Object.keys(spa).sort().join(",") !== "destination,source"
          ) {
            throw new Error(
              "Rewrite #3 must be exactly ** -> /customer/index.html",
            );
          }

          console.log(
            "Firebase hosting routing contract validated successfully",
          );
          NODE

      - name: Install dependencies
        run: npm ci

      - name: Production dependency audit
        run: npm audit --omit=dev --omit=optional

      - name: Apply migrations
        run: npm run migrate

      - name: Full quality gate
        run: npm run check:full

      - name: Migration rollback smoke test
        run: |
          npm run migrate:down
          npm run migrate
