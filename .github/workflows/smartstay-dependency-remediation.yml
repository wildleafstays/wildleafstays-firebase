name: SmartStay Dependency Remediation

on:
  pull_request:
    paths:
      - ".github/workflows/smartstay-dependency-remediation.yml"

permissions:
  contents: write

jobs:
  refresh-production-dependencies:
    if: >-
      github.event.pull_request.head.repo.full_name == 'wildleafstays/wildleafstays-firebase' &&
      github.event.pull_request.head.ref == 'feat/smartstay-unified-discovery-20261018'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: platform-api
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: platform-api/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Remediate production advisories without forced major upgrades
        run: |
          npm install --save-exact fastify@5.12.7
          npm audit fix --omit=dev
          npm audit --omit=dev --omit=optional
      - name: Validate resolved dependency tree
        run: |
          npm ci
          npm run typecheck
          npm run test
      - name: Commit manifest and lockfile to development branch
        run: |
          git config user.name "wildleaf-dependency-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "fix(security): resolve audited production dependency advisories"
            git push origin HEAD:feat/smartstay-unified-discovery-20261018
          fi
