name: SmartStay Isolated Candidate

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type STAGING to build an isolated test candidate (never production)"
        required: true
        type: string
      staging_instance:
        description: "Existing dedicated STAGING Cloud SQL instance ID (not production)"
        required: true
        type: string
  pull_request:
    paths:
      - ".github/workflows/smartstay-isolated-candidate.yml"

permissions:
  contents: read

jobs:
  contract:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Enforce isolation from production
        shell: bash
        run: |
          grep -F 'SMARTSTAY_STAGING_DATABASE_URL' .github/workflows/smartstay-isolated-candidate.yml
          grep -F 'wildleaf-smartstay-candidate' .github/workflows/smartstay-isolated-candidate.yml
          # Assert dangerous production mutators are absent without matching this guard itself.
          python3 - <<'PY'
          from pathlib import Path
          workflow = Path(".github/workflows/smartstay-isolated-candidate.yml").read_text()
          deploy = workflow.split(chr(10) + "  candidate:", 1)[1]
          for parts in [("update", "-traffic"), ("firebase", " deploy")]:
              forbidden = "".join(parts)
              if forbidden in deploy:
                  raise SystemExit("Forbidden production mutation in candidate workflow")
          PY

  candidate:
    if: github.event_name == 'workflow_dispatch' && inputs.confirm == 'STAGING'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    env:
      PROJECT_ID: wildleafstays-web
      REGION: asia-south1
      SERVICE: wildleaf-smartstay-candidate
      IMAGE_REPOSITORY: asia-south1-docker.pkg.dev/wildleafstays-web/wildleaf-platform-api/api
      WIF_PROVIDER: projects/63965798517/locations/global/workloadIdentityPools/github-actions/providers/wildleaf-prod
      DEPLOYER_SERVICE_ACCOUNT: wildleaf-github-deployer@wildleafstays-web.iam.gserviceaccount.com
      RUNTIME_SERVICE_ACCOUNT: wildleaf-platform-api@wildleafstays-web.iam.gserviceaccount.com
    steps:
      - uses: actions/checkout@v6
      - uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOYER_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
      - name: Verify dedicated staging Cloud SQL instance before any deployment
        shell: bash
        env:
          STAGING_INSTANCE: ${{ inputs.staging_instance }}
        run: |
          set -euo pipefail
          if [[ ! "$STAGING_INSTANCE" =~ ^[a-z][a-z0-9-]{2,61}$ ]] || [[ "$STAGING_INSTANCE" == "wildleaf-v2-prod" ]]; then
            echo "::error::A separately named staging Cloud SQL instance is required."
            exit 1
          fi
          gcloud sql instances describe "$STAGING_INSTANCE" --project="$PROJECT_ID" --format='value(name)' | grep -Fx "$STAGING_INSTANCE"
          echo "Staging instance exists; database credentials still require separate verification."
      - name: Verify isolated staging database exists without revealing credentials
        shell: bash
        run: |
          set -euo pipefail
          gcloud secrets versions describe latest --secret=SMARTSTAY_STAGING_DATABASE_URL --project="$PROJECT_ID" --format="value(state)" | grep -Fx ENABLED
          if gcloud run services describe "$SERVICE" --project="$PROJECT_ID" --region="$REGION" --format="value(spec.template.metadata.annotations['run.googleapis.com/cloudsql-instances'])" 2>/dev/null | grep -q 'wildleaf-v2-prod'; then
            echo "::error::Candidate service points to production Cloud SQL; refusing deployment"
            exit 1
          fi
          echo "Staging secret is enabled, but the credential target has NOT been verified; no real booking tests until its destination is reviewed."
      - name: Build immutable candidate image
        shell: bash
        run: |
          set -euo pipefail
          IMAGE="${IMAGE_REPOSITORY}:candidate-${GITHUB_SHA:0:12}"
          gcloud builds submit platform-api --project="$PROJECT_ID" --region="$REGION" --tag="$IMAGE" --quiet
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
      - name: Deploy candidate service only
        shell: bash
        run: |
          set -euo pipefail
          gcloud run deploy "$SERVICE" \
            --project="$PROJECT_ID" \
            --region="$REGION" \
            --image="$IMAGE" \
            --service-account="$RUNTIME_SERVICE_ACCOUNT" \
            --set-cloudsql-instances="$PROJECT_ID:$REGION:${{ inputs.staging_instance }}" \
            --set-secrets="DATABASE_URL=SMARTSTAY_STAGING_DATABASE_URL:latest,RAZORPAY_KEY_ID=RAZORPAY_KEY_ID:3,RAZORPAY_KEY_SECRET=RAZORPAY_KEY_SECRET:3,RAZORPAY_WEBHOOK_SECRET=RAZORPAY_WEBHOOK_SECRET:1" \
            --set-env-vars="NODE_ENV=production,FIREBASE_PROJECT_ID=$PROJECT_ID,SMARTSTAY_PUBLIC_BETA_TEST_ONLY=true,SMARTSTAY_BETA_TEST_PROPERTY_SLUGS=*" \
            --no-allow-unauthenticated \
            --quiet
          echo "Candidate only; no production traffic, Firebase Hosting or database migrations changed."
