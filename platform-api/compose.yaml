services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: wildleaf
      POSTGRES_USER: wildleaf
      POSTGRES_PASSWORD: wildleaf
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wildleaf -d wildleaf"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - wildleaf_pg_data:/var/lib/postgresql

volumes:
  wildleaf_pg_data:
