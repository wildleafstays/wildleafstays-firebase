<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>City Hotels</title>

  <!-- REQUIRED FOR RESPONSIVENESS -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Global styles -->
  <link rel="stylesheet" href="css/style.css">

  <!-- City-specific styles -->
  <link rel="stylesheet" href="css/city.css">

  <!-- Flatpickr styles (MUST be in head) -->
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css"
  />
</head>

<body>

<h1 id="cityTitle"></h1>

<!-- SEARCH BAR (SAME AS INDEX) -->
<div class="search-bar-container">
  <div class="search-box">

    <!-- CITY FIXED -->
    <div class="city-label">
      <strong id="cityLabel"></strong>
    </div>

    <!-- DATE PICKER -->
    <input
      type="text"
      id="dateRange"
      placeholder="Check-in → Check-out"
      readonly
    >

    <select id="adults"></select>
    <select id="kids"></select>


    <button id="searchButton" class="btn-primary">
      Update
    </button>

  </div>
</div>

<!-- HOTEL RESULTS -->
<div id="hotelList" class="city-results"></div>

<!-- SCRIPTS (ORDER MATTERS) -->
<script src="/js/config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
<script src="js/city.js"></script>

</body>
</html>
