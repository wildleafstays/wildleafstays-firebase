<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Explore Wildleaf stays with live availability, flexible room booking and private entire-property stays."
    />
    <title>Destination stays | Wildleaf Stays</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/wildleaf-theme.css" />
    <link rel="stylesheet" href="/customer/styles.css" />
    <link rel="stylesheet" href="/customer/destination.css" />
    <link rel="stylesheet" href="/customer/mobile-search.css" />
  </head>
  <body class="destination-page">
    <div class="public-test-notice" role="status">
      SMARTSTAY PUBLIC TEST: Online payments and reservations are for testing only.
      Contact Wildleaf directly to arrange a real stay.
    </div>

    <header class="site-header destination-header">
      <a class="brand" href="/customer/" aria-label="Wildleaf Stays home">
        <span class="brand-mark" aria-hidden="true">W</span>
        <span><strong>Wildleaf</strong><small>STAYS</small></span>
      </a>
      <nav class="site-nav" aria-label="Primary navigation">
        <a href="/customer/">Home</a>
        <a href="#availableStays">Explore stays</a>
      </nav>
    </header>

    <main>
      <div class="destination-topbar">
        <section class="destination-intro" aria-labelledby="resultsHeading">
          <h1 id="resultsHeading">Kasauli</h1>
          <p id="resultsSummary" class="muted" role="status">
            Checking available stays…
          </p>
        </section>

        <section class="destination-search-shell" aria-label="Change your search">
        <form id="destinationSearchForm" class="destination-search-form">
          <label class="destination-field destination-field-location">
            <span>Destination</span>
            <input name="destination" autocomplete="off" required />
          </label>
          <div class="destination-search-group destination-date-group">
            <label>
              <span>Check-in</span>
              <input name="arrivalDate" type="date" required />
            </label>
            <label>
              <span>Check-out</span>
              <input name="departureDate" type="date" required />
            </label>
          </div>
          <div class="destination-search-group destination-party-group">
            <label>
              <span>Adults</span>
              <input name="adults" type="number" min="1" max="10" value="2" required />
            </label>
            <label>
              <span>Children</span>
              <input name="children" type="number" min="0" max="6" value="0" required />
            </label>
            <label>
              <span>Rooms</span>
              <input name="rooms" type="number" min="1" max="20" value="1" required />
            </label>
          </div>
          <div id="childAgeFields" class="destination-child-ages" aria-live="polite"></div>
          <button class="destination-search-submit" type="submit" aria-label="Search available stays">
            <svg aria-hidden="true" viewBox="0 0 24 24" focusable="false">
              <circle cx="11" cy="11" r="6.5"></circle>
              <path d="m16 16 4 4"></path>
            </svg>
          </button>
          </form>
        </section>
      </div>

      <section id="availableStays" class="destination-results-section">
        <div class="destination-results-toolbar">
          <div class="destination-mode-tabs" role="group" aria-label="Choose how to stay">
            <button class="is-active" type="button" data-mode="all" aria-pressed="true">
              All stays
            </button>
            <button type="button" data-mode="rooms" aria-pressed="false">
              Private rooms
            </button>
            <button type="button" data-mode="entire" aria-pressed="false">
              Entire properties
            </button>
          </div>
          <label class="destination-sort">
            <span>Sort by</span>
            <select id="sortResults">
              <option value="recommended">Recommended</option>
              <option value="price-low">Price: low to high</option>
              <option value="price-high">Price: high to low</option>
              <option value="name">Property name</option>
            </select>
          </label>
        </div>

        <div id="destinationResults" class="destination-results-grid" aria-live="polite"></div>
      </section>
    </main>

    <footer class="site-footer compact-footer">
      <p>Wildleaf Stays · Thoughtful stays, naturally.</p>
    </footer>

    <script src="/customer/config.js"></script>
    <script type="module" src="/customer/destination.js"></script>
  </body>
</html>
