<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Browse Wildleaf entire-property stays by destination, category, and property type."
    />
    <title>Entire Property Stays | Wildleaf Stays</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/wildleaf-theme.css" />
    <link rel="stylesheet" href="/customer/styles.css" />
    <link rel="stylesheet" href="/customer/experience.css" />
    <link rel="stylesheet" href="/customer/entire-properties.css" />
  </head>
  <body class="catalog-page entire-properties-page">
    <header class="site-header catalog-header">
      <a class="brand" href="/customer/" aria-label="Wildleaf Stays home">
        <span class="brand-mark" aria-hidden="true">W</span>
        <span><strong>Wildleaf</strong><small>STAYS</small></span>
      </a>

      <nav class="site-nav desktop-nav" aria-label="Primary navigation">
        <a href="/customer/">Home</a>
        <a href="/customer/#destinations">Destinations</a>
        <a href="/customer/#stays">Stay categories</a>
        <a href="/customer/#contact">Contact</a>
      </nav>

      <details class="mobile-menu">
        <summary aria-label="Open navigation menu">☰</summary>
        <nav aria-label="Mobile navigation">
          <a href="/customer/">Home</a>
          <a href="/customer/#destinations">Destinations</a>
          <a href="/customer/#stays">Stay categories</a>
          <a href="/customer/#contact">Contact</a>
        </nav>
      </details>
    </header>

    <main>
      <section
        id="entirePropertyHero"
        class="entire-property-hero hidden"
        aria-label="Entire Property highlights"
      >
        <img id="entirePropertyHeroImage" class="entire-property-hero-image" alt="" />
        <div class="entire-property-hero-shade" aria-hidden="true"></div>
        <div class="entire-property-hero-content">
          <p id="entirePropertyHeroOffer" class="entire-property-hero-offer hidden"></p>
          <h1 id="entirePropertyHeroHeadline" class="hidden"></h1>
          <p id="entirePropertyHeroSubtitle" class="entire-property-hero-subtitle hidden"></p>
          <a
            id="entirePropertyHeroCta"
            class="button button-primary entire-property-hero-cta hidden"
            href="#entirePropertyFilters"
          ></a>
        </div>
        <div
          id="entirePropertyHeroControls"
          class="entire-property-hero-controls hidden"
          aria-label="Campaign slides"
        >
          <button id="entirePropertyHeroPrevious" type="button" aria-label="Previous campaign">←</button>
          <div id="entirePropertyHeroDots" class="entire-property-hero-dots" role="tablist"></div>
          <button id="entirePropertyHeroNext" type="button" aria-label="Next campaign">→</button>
        </div>
      </section>

      <section class="catalog-filter-shell" aria-label="Find an entire-property stay">
        <form id="entirePropertyFilters" class="catalog-filter-form">
          <label class="catalog-field catalog-query-field">
            <span>Search</span>
            <input
              id="catalogQuery"
              name="q"
              type="search"
              placeholder="Property, locality, or destination"
              autocomplete="off"
            />
          </label>

          <label class="catalog-field">
            <span>Destination</span>
            <select id="catalogDestination" name="destination">
              <option value="">All destinations</option>
            </select>
          </label>

          <label class="catalog-field">
            <span>Property Category</span>
            <select id="catalogCategory" name="categoryId">
              <option value="">All categories</option>
            </select>
          </label>

          <label class="catalog-field">
            <span>Property Type</span>
            <select id="catalogType" name="typeId" disabled>
              <option value="">All property types</option>
            </select>
          </label>

          <button class="button button-primary catalog-search-button" type="submit">
            Search
          </button>
          <button id="catalogReset" class="catalog-reset-button" type="button">
            Clear
          </button>
        </form>
      </section>

      <section class="catalog-results-section" aria-label="Entire-property stays by destination">
        <p id="catalogStatus" class="sr-only" role="status">
          Loading live properties…
        </p>
        <div id="catalogLocationGroups" class="catalog-location-groups" aria-live="polite"></div>
      </section>
    </main>

    <footer id="contact" class="site-footer">
      <div class="brand footer-brand">
        <span class="brand-mark" aria-hidden="true">W</span
        ><span><strong>Wildleaf</strong><small>STAYS</small></span>
      </div>
      <p>Thoughtful stays, naturally.</p>
      <p class="footer-note">
        Need booking help? Contact the Wildleaf support team.
      </p>
    </footer>

    <script src="/customer/config.js"></script>
    <script type="module" src="/customer/entire-properties.js"></script>
  </body>
</html>
