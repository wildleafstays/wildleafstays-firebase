<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <!-- ✅ REQUIRED FOR RESPONSIVENESS -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>The Lalitas Hospitality</title>

  <!-- Premium Homepage Styles -->
  <link rel="stylesheet" href="css/header.css">
  <link rel="stylesheet" href="css/homepage.css">




  <!-- Google Font -->
  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
    rel="stylesheet"
  >

  <!-- Date Picker -->
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css"
  >
</head>

<body>

<!-- ======================================================
     HEADER (Logo + Title)
====================================================== -->
<header id="headerContainer"></header>

<!-- ======================================================
     HERO SECTION (Masonry + Search Bar)
====================================================== -->
<section class="hero-wrapper hero-full">

  <!-- HERO SLIDER -->
  <div id="heroSlider" class="hero-slider"></div>

  <!-- HERO MESSAGING -->
  <div class="hero-overlay">
  <div id="heroMessage" class="hero-message"></div>
</div>

<!-- FULL SCREEN OFFER SCROLLER -->
<div class="hero-offer-bar" id="heroOfferBar" style="display:none;">
  <div class="hero-offer-track" id="heroOfferTrack"></div>
</div>


  <!-- Search Bar (UNCHANGED) -->
  <div class="search-bar-container">
    <div class="search-box">

      <select id="citySelect">
        <option value="">Select Location</option>
      </select>

      <input
        type="text"
        id="dateRange"
        placeholder="Check-in → Check-out"
        readonly
      >

      <select id="adults"></select>
<select id="kids"></select>


      <button id="searchButton" class="btn-primary">
        Search
      </button>

    </div>
  </div>

</section>


<!-- ======================================================
     DYNAMIC HOMEPAGE SECTIONS
====================================================== -->
<main id="dynamicSections"></main>

<!-- ======================================================
     FOOTER
====================================================== -->
<footer class="footer">
  <p>© 2025 The Lalitas Hospitality · All Rights Reserved</p>
</footer>

<!-- ======================================================
     SCRIPTS
====================================================== -->
<script src="js/config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
<script src="js/home.js"></script>
<script src="js/header.js"></script>

<script>
  document.addEventListener("DOMContentLoaded", loadHeader);
</script>

</body>
</html>
