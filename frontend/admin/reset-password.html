<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Reset Password | Wildleaf Admin</title>
  <link rel="stylesheet" href="admin.css" />
</head>
<body>
  <h1>Reset Password</h1>

  <form id="rpForm">
    <input type="password" id="newPassword" placeholder="New Password" required />
    <input type="password" id="confirmPassword" placeholder="Confirm New Password" required />
    <button type="submit">Reset Password</button>
  </form>

  <p id="msg" style="margin-top:10px;"></p>

  <script>
    const API_BASE = "";

    const msg = document.getElementById("msg");
    const form = document.getElementById("rpForm");

    const params = new URLSearchParams(window.location.search);
    const token = params.get("token");

    if (!token) {
      msg.innerText = "Invalid reset link (missing token).";
      form.style.display = "none";
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      msg.innerText = "";

      const newPassword = document.getElementById("newPassword").value.trim();
      const confirm = document.getElementById("confirmPassword").value.trim();

      if (newPassword.length < 8) {
        msg.innerText = "Password must be at least 8 characters.";
        return;
      }
      if (newPassword !== confirm) {
        msg.innerText = "Passwords do not match.";
        return;
      }

      msg.innerText = "Resetting...";

      const res = await fetch(`${API_BASE}/api/admin/reset-password`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ token, newPassword })
      });

      const data = await res.json();

      if (!res.ok) {
        msg.innerText = data.error || "Reset failed.";
        return;
      }

      msg.innerText = "Password reset successful. Redirecting to login...";
      setTimeout(() => {
        window.location.href = "./login.html";
      }, 900);
    });
  </script>


</body>
</html>
