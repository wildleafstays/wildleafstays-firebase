<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Wildleaf Admin</title>
    <link rel="stylesheet" href="/admin/styles.css">
  </head>
  <body>
    <main id="loginView" class="login-view">
      <form id="loginForm" class="login-card">
        <strong>Wildleaf Admin</strong>
        <h1>Sign in</h1>
        <input name="email" type="email" placeholder="Email" required>
        <input name="password" type="password" placeholder="Password" required>
        <button type="submit">Login</button>
        <p id="loginMessage" class="message"></p>
      </form>
    </main>

    <div id="adminApp" class="admin-app hidden">
      <aside class="sidebar">
        <strong>Wildleaf Admin</strong>
        <button data-tab="properties" class="nav active">Properties</button>
        <button data-tab="rooms" class="nav">Rooms</button>
        <button data-tab="inventory" class="nav">Inventory & Rates</button>
        <button data-tab="bookings" class="nav">Bookings</button>
        <button data-tab="homepage" class="nav">Home Page</button>
        <a href="/customer/">View Website</a>
        <button id="logoutBtn" class="secondary">Logout</button>
      </aside>

      <main class="workspace">
        <header class="workspace-head">
          <div>
            <h1 id="screenTitle">Properties</h1>
            <p id="message" class="message">Ready.</p>
          </div>
          <button id="refreshBtn" class="secondary">Refresh</button>
        </header>

        <section id="propertiesTab" class="tab-panel">
          <form id="propertyForm" class="panel form-grid">
            <h2>Add / Edit Property</h2>
            <input name="id" type="hidden">
            <input name="name" placeholder="Property name" required>
            <input name="destination" placeholder="Destination" required>
            <input name="gstPercent" type="number" min="0" step="0.01" placeholder="GST %">
            <input name="infantMaxAge" type="number" min="0" value="2" placeholder="Infant max age">
            <textarea name="description" placeholder="Short description"></textarea>
            <label class="upload-box">
              Property images
              <input id="propertyImages" type="file" accept="image/*" multiple>
            </label>
            <div id="propertyPhotoPreview" class="photo-preview"></div>
            <input name="photos" type="hidden">
            <label class="check">
              <input name="sellAsFullVilla" type="checkbox">
              Also sell as full villa. Villa rate is calculated from all room rates.
            </label>
            <div>
              <h3>Facilities</h3>
              <div id="propertyFacilities" class="check-grid"></div>
            </div>
            <div>
              <h3>Amenities</h3>
              <div id="propertyAmenities" class="check-grid"></div>
            </div>
            <button type="submit">Save Property</button>
          </form>
          <div id="properties" class="panel"></div>
        </section>

        <section id="roomsTab" class="tab-panel hidden">
          <form id="roomForm" class="panel form-grid">
            <h2>Add / Edit Room Category</h2>
            <input name="id" type="hidden">
            <select name="propertyId" id="propertySelect" required></select>
            <input name="name" placeholder="Room category name" required>
            <textarea name="description" placeholder="Room description"></textarea>
            <label class="upload-box">
              Room images
              <input id="roomImages" type="file" accept="image/*" multiple>
            </label>
            <div id="roomPhotoPreview" class="photo-preview"></div>
            <input name="photos" type="hidden">
            <input name="viewType" placeholder="View type, e.g. Mountain view">
            <input name="bedType" placeholder="Bed type, e.g. King bed">
            <input name="sizeText" placeholder="Room size, e.g. 320 sq ft">
            <input name="totalRooms" type="number" min="1" placeholder="Total rooms" required>
            <input name="basePrice" type="number" min="1" placeholder="Base nightly rate" required>
            <input name="gstPercent" type="number" min="0" step="0.01" placeholder="GST %">
            <input name="maxGuests" type="number" min="1" placeholder="Max guests per room" required>
            <input name="includedGuests" type="number" min="1" placeholder="Guests included in price">
            <input name="extraAdultRate" type="number" min="0" placeholder="Extra adult rate per night">
            <input name="extraKidRate" type="number" min="0" placeholder="Extra kid rate per night">
            <div>
              <h3>Room Amenities</h3>
              <div id="roomAmenities" class="check-grid"></div>
            </div>
            <button type="submit">Save Room Category</button>
          </form>
          <div id="roomsList" class="panel"></div>
        </section>

        <section id="inventoryTab" class="tab-panel hidden">
          <form id="inventoryForm" class="panel compact-grid">
            <h2>Inventory & Rate Manager</h2>
            <select name="propertyId" id="inventoryProperty" required></select>
            <select name="roomCategoryId" id="inventoryRoom" required></select>
            <input name="start" type="date" required>
            <input name="end" type="date" required>
            <input name="price" type="number" min="0" placeholder="Nightly rate override">
            <input name="availableRooms" type="number" min="0" placeholder="Available rooms">
            <label class="check">
              <input name="manuallyClosed" type="checkbox">
              Close this room category
            </label>
            <button type="submit">Apply</button>
          </form>
          <div id="inventoryTable" class="panel"></div>
        </section>

        <section id="bookingsTab" class="tab-panel hidden">
          <div id="bookingsList" class="panel"></div>
        </section>

        <section id="homepageTab" class="tab-panel hidden">
          <form id="homepageForm" class="panel form-grid">
            <h2>Home Page Editor</h2>
            <input name="sectionId" placeholder="Section ID, e.g. hero" required>
            <input name="title" placeholder="Title">
            <textarea name="subtitle" placeholder="Subtitle / description"></textarea>
            <input name="imageUrl" placeholder="Image URL for now">
            <input name="order" type="number" value="1" placeholder="Order">
            <label class="check">
              <input name="active" type="checkbox" checked>
              Active
            </label>
            <button type="submit">Save Home Section</button>
          </form>
          <div id="homepageList" class="panel"></div>
        </section>
      </main>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-storage-compat.js"></script>
    <script src="/__/firebase/init.js"></script>
    <script src="/admin/admin.js"></script>
  </body>
</html>
