<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Wildleaf Admin</title>
    <link rel="stylesheet" href="/admin/styles.css">
  </head>
  <body>
    <header class="topbar">
      <strong>Wildleaf Admin</strong>
      <a href="/customer/">View Website</a>
    </header>

    <main class="layout">
      <section class="panel">
        <h1>Add Property</h1>
        <p class="muted">Create the physical hotel/villa once. Full villa sale is an option on the same property.</p>
        <form id="propertyForm">
          <input name="name" placeholder="Property name" required>
          <input name="destination" placeholder="Destination" required>
          <textarea name="description" placeholder="Short description"></textarea>
          <input name="photos" placeholder="Property photo URLs, comma separated">
          <input name="facilities" placeholder="Facilities, comma separated: Pool, Kitchen, Spa, Restaurant">
          <input name="amenities" placeholder="Amenities, comma separated">
          <input name="infantMaxAge" type="number" min="0" value="2" placeholder="Infant max age">
          <label class="check">
            <input name="sellAsFullVilla" type="checkbox">
            Also sell this property as a full villa. Price is auto-total of all rooms.
          </label>
          <button type="submit">Save Property</button>
        </form>
      </section>

      <section class="panel">
        <h2>Add Room Category</h2>
        <form id="roomForm">
          <select name="propertyId" id="propertySelect" required></select>
          <input name="name" placeholder="Room category name" required>
          <textarea name="description" placeholder="Room description"></textarea>
          <input name="photos" placeholder="Room photo URLs, comma separated">
          <input name="amenities" placeholder="Room amenities, comma separated">
          <input name="viewType" placeholder="View type, e.g. Mountain view">
          <input name="bedType" placeholder="Bed type, e.g. King bed">
          <input name="sizeText" placeholder="Room size, e.g. 320 sq ft">
          <input name="totalRooms" type="number" min="1" placeholder="Total rooms" required>
          <input name="basePrice" type="number" min="1" placeholder="Nightly price" required>
          <input name="maxGuests" type="number" min="1" placeholder="Max guests per room" required>
          <input name="includedGuests" type="number" min="1" placeholder="Guests included in price">
          <input name="extraAdultRate" type="number" min="0" placeholder="Extra adult rate per night">
          <input name="extraKidRate" type="number" min="0" placeholder="Extra kid rate per night">
          <button type="submit">Save Room Category</button>
        </form>
      </section>

      <section class="panel wide">
        <h2>Properties</h2>
        <div id="message" class="message"></div>
        <div id="properties"></div>
      </section>
    </main>

    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
    <script src="/__/firebase/init.js"></script>
    <script src="/admin/admin.js"></script>
  </body>
</html>
