<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Change Password | Wildleaf Admin</title>
  <link rel="stylesheet" href="admin.css" />

<script src="auth.js"></script>
<script src="admin-guard.js"></script>

</head>
<body>

  <h1>Change Password</h1>

  <form id="cpForm">
    <input type="password" id="currentPassword" placeholder="Current Password" required />
    <input type="password" id="newPassword" placeholder="New Password" required />
    <input type="password" id="confirmPassword" placeholder="Confirm New Password" required />
    <button type="submit">Update Password</button>
  </form>

  <p id="msg" style="margin-top:10px;"></p>
<script src="/js/config.js"></script>
  <script type="module">
    import { authHeaders, logout, secureFetch } from "./auth.js";

    // Guard
    authHeaders();

    const msg = document.getElementById("msg");
    const form = document.getElementById("cpForm");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      msg.innerText = "";

      const currentPassword = document.getElementById("currentPassword").value.trim();
      const newPassword = document.getElementById("newPassword").value.trim();
      const confirm = document.getElementById("confirmPassword").value.trim();

      if (newPassword.length < 8) {
        msg.innerText = "Password must be at least 8 characters.";
        return;
      }
      if (newPassword !== confirm) {
        msg.innerText = "Passwords do not match.";
        return;
      }

      msg.innerText = "Updating...";

      const res = await secureFetch("/api/admin/change-password", {
        method: "POST",
        body: JSON.stringify({ currentPassword, newPassword })
      });

      if (!res) return;

      const data = await res.json();

      if (!res.ok) {
        msg.innerText = data.error || "Failed to change password.";
        return;
      }

      msg.innerText = "Password updated. Logging you out...";
      setTimeout(() => logout(), 700);
    });
  </script>


</body>
</html>
