<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <!-- ✅ REQUIRED FOR RESPONSIVENESS -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Admin · Bookings</title>

  <!-- ✅ ALL STYLES COME FROM HERE ONLY -->
  <link rel="stylesheet" href="bookings.css" />
</head>

<body>

  <h1>📋 Bookings</h1>

  <!-- ================================
       FILTERS
  ================================ -->
  <div class="filters">
    <select id="hotelFilter">
      <option value="">All Hotels</option>
    </select>

    <select id="statusFilter">
      <option value="">All Status</option>
      <option value="confirmed">Confirmed</option>
      <option value="cancelled">Cancelled</option>
    </select>

    <button onclick="loadBookings()">Apply</button>
  </div>

  <!-- ================================
       BOOKINGS TABLE (RESPONSIVE WRAPPER)
  ================================ -->
  <div class="table-wrapper">
    <table>
     <thead>
  <tr>
    <th style="width:60px;">ID</th>
    <th style="width:180px;">Hotel</th>
    <th style="width:90px;">Type</th>
    <th style="width:260px;">Room Names</th>
    <th style="width:80px;">#Rooms</th>
    <th style="width:160px;">Guest</th>
    <th style="width:110px;">Check-In</th>
    <th style="width:110px;">Check-Out</th>
    <th style="width:110px;">Total</th>
    <th style="width:110px;">Advance</th>
    <th style="width:110px;">Balance</th>
    <th style="width:100px;">Pay Status</th>
    <th style="width:100px;">Status</th>
    <th style="width:90px;">Source</th>
    <th style="width:90px;">Action</th>
  </tr>
</thead>


      <tbody id="bookingsTable">
        <tr>
          <td colspan="9">Loading...</td>
        </tr>
      </tbody>
    </table>
  </div>

  <!-- ================================
       SCRIPT
  ================================ -->
<script src="/js/config.js"></script>
  <script type="module" src="bookings.js"></script>

</body>
</html>
