<script src="/admin/admin-guard.js"></script>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Booking Calendar</title>

  <link rel="stylesheet" href="calendar.css" />

  <!-- Flatpickr CSS (recommended, safe) -->
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css"
  />
</head>
<body>

<h2>Booking Calendar</h2>

<label for="calendarHotelSelect"><b>Select Hotel</b></label>
<select id="calendarHotelSelect">
  <option value="">Select Hotel</option>
</select>
<div style="margin-bottom: 12px;">
  <button id="prevMonth">◀ Prev 14 days</button>

  <select id="monthSelect"></select>
  <select id="yearSelect"></select>

  <button id="nextMonth">Next 14 days▶</button>
</div>

<div class="calendar-wrapper">
  <table id="calendarTable">
    <thead id="calendarHead"></thead>
    <tbody id="calendarBody"></tbody>
  </table>
</div>

<!-- ================= ADD BOOKING MODAL ================= -->
<div id="addBookingModal" class="modal hidden">
  <div class="modal-content">
    <h3>Add Booking</h3>

    <label>Guest Name</label>
    <input type="text" id="abGuestName">

    <label>Mobile</label>
    <input type="text" id="abGuestPhone">

    <label>Dates (Check-in → Check-out)</label>
    <input type="text" id="abDateRange" placeholder="Select dates">

    <!-- Hidden fields used by backend -->
    <input type="hidden" id="abCheckIn">
    <input type="hidden" id="abCheckOut">

    <label><b>Available Rooms</b></label>
    <div id="availableRooms" class="available-rooms">
      <small>Select one or more rooms</small>
    </div>

    <label>Payment Status</label>
    <select id="abPaymentStatus">
      <option value="paid">Paid</option>
      <option value="partial">Partial</option>
      <option value="unpaid">Unpaid</option>
    </select>

    <div class="payment-grid">
      <div>
        <label>Total Amount</label>
        <input id="totalAmount" type="number" oninput="recalcBalance()" />
      </div>

      <div>
        <label>Advance Amount</label>
        <input id="advanceAmount" type="number" oninput="recalcBalance()" />
      </div>
    </div>

    <label>Balance</label>
    <input id="balanceAmount" type="number" disabled />

    <label>Notes</label>
    <textarea id="abNotes"></textarea>

    <div class="modal-actions">
      <button id="savePaymentBtn">Save</button>
      <button type="button" onclick="closeModal()">Cancel</button>
    </div>
  </div>
</div>

<!-- ================= SCRIPTS (ORDER MATTERS) ================= -->

<!-- Flatpickr JS -->
<script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>

<!-- Calendar logic -->
<script src="/js/config.js"></script>
<script type="module" src="calendar.js"></script>


</body>
</html>
