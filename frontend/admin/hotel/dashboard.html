<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Hotel Dashboard</title>
  <link rel="stylesheet" href="dashboard.css" />
</head>

<body>

<header class="dashboard-header">

  <!-- LEFT: Hotel Selector -->
  <select id="hotelSelect" class="hotel-dropdown"></select>

  <!-- CENTER: Navigation -->
 <div class="hotel-nav">
  <a href="#" data-page="settings.html">🏨 Hotel Settings</a>
  <a href="#" data-page="inventory/inventory.html">📦 Inventory</a>
  <a href="#" data-page="calendar/calendar.html">📅 Calendar</a>
  <a href="#" data-page="bookings/bookings.html">📋 Bookings</a>
</div>
  <!-- RIGHT: Global Settings -->
  <button id="btnGlobalSettings" title="Homepage Settings">⚙️</button>

<button
  type="button"
  class="btn btn-warning"
  onclick="window.location.href='../change-password.html'">
  🔒 Change Password
</button>


<button id="btnLogout" class="logout-btn" title="Logout">
  🚪 Logout
</button>

<button id="btnAddHotel" title="Add New Hotel">
  ➕ Add Hotel
</button>

</header>

<div class="dashboard-content">
  <iframe
    id="dashboardFrame"
    src="calendar/calendar.html"
    frameborder="0"
    style="width:100%; height:80vh;"
  ></iframe>
</div>

<!-- LONG-TERM CORRECT WAY -->
<script src="/js/config.js"></script>
<script type="module" src="./dashboard.js"></script>

</body>
</html>
