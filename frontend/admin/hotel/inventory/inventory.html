<script src="/admin/admin-guard.js"></script>
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <!-- ✅ REQUIRED FOR RESPONSIVENESS -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Room Inventory Calendar</title>

  <!-- ✅ ALL STYLES COME FROM HERE ONLY -->
  <link rel="stylesheet" href="inventory.css" />
</head>

<body>

  <h1>Room Inventory Calendar</h1>

  <!-- ================================
       CONTROLS
  ================================ -->
  <div class="controls">
    <label>
              Hotel Name
      <select id="hotelSelect"></select>
    </label>

    <label>
      Start Date
      <input type="date" id="startDate" />
    </label>

    <label>
      End Date
      <input type="date" id="endDate" />
    </label>

    <button id="todayBtn">Today</button>
    <button id="prevBtn">Previous 8 Days</button>
    <button id="nextBtn">Next 8 Days</button>
    <button id="loadBtn">Load Calendar</button>
  </div>

<small id="hotelLockedNote" style="display:none">
  Hotel selected from Admin
</small>

  <!-- ================================
       INVENTORY TABLE
  ================================ -->
  <div class="table-wrapper">
    <table id="inventoryTableWrapper">
      <tbody id="inventoryTable">
        <!-- Header + rows injected by inventory.js -->
      </tbody>
    </table>
  </div>

  <!-- ================================
       SCRIPT
  ================================ -->
<script src="/js/config.js"></script>
  <script type="module" src="inventory.js"></script>


</body>
</html>
