<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Confirm Your Booking | Wildleaf Stays</title>

  <!-- ✅ REQUIRED FOR RESPONSIVENESS -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- CSS -->
<link rel="stylesheet" href="css/header.css">
<link rel="stylesheet" href="booking-summary.css">


  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
</head>

<body>

<div class="container">

  <h1>Confirm Your Booking</h1>

  <!-- ================================
       GUEST DETAILS
  ================================ -->
  <div class="section">
    <h3>Guest Details</h3>

    <label>
      Full Name*
      <input type="text" id="guestName" required />
    </label>

    <label>
      WhatsApp Mobile*
      <input type="tel" id="guestPhone" required />
    </label>

    <label>
      Email (optional)
      <input type="email" id="guestEmail" />
    </label>
  </div>

  <p class="info-text">
    Please review your booking details before final confirmation.
  </p>

  <!-- ================================
       BOOKING INFO
  ================================ -->
  <div class="section">
    <strong>Hotel:</strong> <span id="hotelName"></span><br>
    <strong>Check-in:</strong> <span id="checkIn"></span><br>
    <strong>Check-out:</strong> <span id="checkOut"></span>
  </div>

  <!-- ================================
       ROOM SUMMARY
  ================================ -->
  <div class="section">
    <h3>Room Summary</h3>

    <div class="table-wrapper">
      <table>
        <thead>
          <tr>
            <th>Room</th>
            <th>Adults</th>
            <th>Kids</th>
            <th>Price</th>
          </tr>
        </thead>
        <tbody id="summaryBody"></tbody>
      </table>
    </div>
  </div>

  <!-- ================================
       TOTAL
  ================================ -->
  <div class="total-box">
    <strong>Total Payable: ₹ <span id="totalAmount">0</span></strong>
  </div>

  <!-- ================================
       ACTIONS
  ================================ -->
  <div class="actions">
    <button class="back-btn" onclick="modifySelection()">
      Modify Selection
    </button>

    <button class="final-btn" id="finalConfirmBtn">
      Final Book Now
    </button>
  </div>

</div>
<script src="/js/config.js"></script>
<script src="/js/booking-summary.js"></script>

</body>
</html>
